<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f23;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="50%" style="stop-color:#8b5cf6" />
      <stop offset="100%" style="stop-color:#a78bfa" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="280" rx="12" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="1200" y2="200"/>
    <line x1="400" y1="0" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1000" y2="0"/>
    <line x1="0" y1="100" x2="800" y2="0"/>
  </g>
  
  <!-- Data flow lines -->
  <g opacity="0.15" stroke="url(#accent)" stroke-width="1.5" fill="none">
    <path d="M80,140 Q200,80 320,140 Q440,200 560,140 Q680,80 800,140 Q920,200 1040,140" stroke-dasharray="8,4"/>
    <circle cx="80" cy="140" r="4" fill="#6366f1"/>
    <circle cx="320" cy="140" r="4" fill="#8b5cf6"/>
    <circle cx="560" cy="140" r="4" fill="#a78bfa"/>
    <circle cx="800" cy="140" r="4" fill="#8b5cf6"/>
    <circle cx="1040" cy="140" r="4" fill="#6366f1"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white" text-anchor="middle" filter="url(#glow)">
    Andrometry
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#a78bfa" text-anchor="middle" letter-spacing="4">
    PERSONAL CONTEXT ENGINE FOR AI-AGENT ALIGNMENT
  </text>
  
  <!-- Tagline -->
  <text x="600" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8" text-anchor="middle">
    Know what you're doing. Let your AI know too.
  </text>
  
  <!-- Stats -->
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="240" y="230" font-size="24" font-weight="700" fill="#6366f1">15</text>
    <text x="240" y="250" font-size="11" fill="#64748b" letter-spacing="1">ACTIVITY TYPES</text>
    
    <text x="480" y="230" font-size="24" font-weight="700" fill="#8b5cf6">59</text>
    <text x="480" y="250" font-size="11" fill="#64748b" letter-spacing="1">MCP TOOLS</text>
    
    <text x="720" y="230" font-size="24" font-weight="700" fill="#a78bfa">60</text>
    <text x="720" y="250" font-size="11" fill="#64748b" letter-spacing="1">API ENDPOINTS</text>
    
    <text x="960" y="230" font-size="24" font-weight="700" fill="#c4b5fd">10</text>
    <text x="960" y="250" font-size="11" fill="#64748b" letter-spacing="1">COLLECTORS</text>
  </g>
  
  <!-- Accent line -->
  <rect x="100" y="268" width="1000" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>
</svg>
